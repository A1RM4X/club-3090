schema_version: 1
id: mimo-v2.6-9b
display_name: MiMo V2.6 Distill Qwen 9B (Xiaomi)
description: Xiaomi MiMo V2.6 distill of Qwen3.5-9B — a vision-capable Qwen3-Next dense-FFN hybrid (8 full-attention + 24 GDN layers) serving full 262K context plus vision on ONE 3090, leaving the second card free.
family: qwen3-next-hybrid
# Arch CONFIRMED from the GGUF header (general.architecture=qwen35), not from the
# model card: block_count=32, full_attention_interval=4 -> 8 full-attention layers
# (standard GQA KV) + 24 GDN/DeltaNet linear-attention layers (ssm.state_size=128,
# ssm.group_count=16). Same shape as ornith-1.0-9b; base_model is "Qwen3.5 9B".
# ⚠️ NO nextn/mtp keys and no MTP tensors in the GGUF -> spec-dec is drafter-free
# n-gram only. Measured and REJECTED as a default (costs ~5.5% narrative decode
# for no gain) — see learnings/mimo-v2.6-9b.md.
hidden_size: 4096
num_hidden_layers: 32
num_attn_heads: 16
num_kv_heads: 4
head_dim_attn: 256          # key_length == value_length == 256
intermediate_size: 12288    # feed_forward_length
attention_k_eq_v: false     # standard GQA on the full-attn layers — K and V separate caches
max_ctx_supported: 262144
# Hybrid KV: only the 8 full-attention layers grow GQA KV; the 24 GDN layers hold
# tiny SSM state. MEASURED from the boot log at LLAMA_ARG_LOG_VERBOSITY=4
# (2026-09-22): "llama_kv_cache: size = 4352.00 MiB (262144 cells, 8 layers)" at
# q8_0, 8192.00 MiB at f16 — i.e. 16 KiB/token and 32 KiB/token respectively.
# ⚠️ Do NOT extrapolate per-layer x 32 layers; that overshoots ~4x.
vision_capable: true
weights:
  bartowski-q8:
    path: mimo-v2.6-distill-qwen-9b-gguf-bartowski
    local_subdir: mimo-v2.6-distill-qwen-9b-gguf-bartowski
    size_gb: 8.9                 # 9,545,979,424 B = 8.89 GiB, verified on disk
    format: gguf
    status: experimental
    hf_repo: bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF
    # Pinned to the bytes the 2026-09-22 BENCHMARKS row was measured on. This sha
    # is also what our local .cache metadata records, so the pin is not aspirational.
    revision: 4371da10c84fb26da3592d4cf312d24aa82b7b65
    # REQUIRED, not optional: this repo is a 25-file MULTI-QUANT bucket. Without
    # `files:` the fetch is the WHOLE repo (ADDING_MODELS.md "Two silent traps").
    # Artifacts sit at the repo ROOT, so they land flat and need no prefix.
    files:
      - MiMo-V2.6-Distill-Qwen-9B-Q8_0.gguf
    engine: llama-cpp
    kind: gguf
    # ⚠️ NOT "*.gguf": this variant and bartowski-mmproj-f16 share one flat bucket
    # dir, so a bucket-wide glob makes their download states indistinguishable —
    # delete the Q8 weights and the mmproj alone would still report PRESENT
    # (test-weights-glob-distinct). The glob must match only THIS artifact.
    verify_glob: "*Q8_0.gguf"
  bartowski-mmproj-f16:
    path: mimo-v2.6-distill-qwen-9b-gguf-bartowski
    local_subdir: mimo-v2.6-distill-qwen-9b-gguf-bartowski
    size_gb: 0.86                # 918,166,048 B, verified on disk
    format: gguf
    status: experimental
    hf_repo: bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF
    revision: 4371da10c84fb26da3592d4cf312d24aa82b7b65
    files:
      - mmproj-MiMo-V2.6-Distill-Qwen-9B-f16.gguf
    engine: llama-cpp
    kind: mmproj
    verify_glob: "mmproj*.gguf"      # see the note on bartowski-q8's glob
    setup_env: WITH_VISION=1
    manual_note: >-
      F16 multimodal projector for MiMo V2.6 9B. Boot-verified 2026-09-21/22 —
      llama-server loads it as a multimodal model and verify-full scores vision
      4/4 on ground truth. Sibling mmproj-*-bf16.gguf NOT fetched: F16 is the
      standard tower precision and is fine on Ampere. 27.4% of the SFT mixture
      was visual, so vision is a first-class capability here, not an add-on.
default_weight_variant: bartowski-q8
compatible_drafters: []        # no MTP head, no draft model — ngram is drafter-free
valid_tp:
  - 1
requires_genesis: false
setup:
  # The mmproj is a companion, not the primary: WITH_VISION=1 pulls it alongside.
  vision: bartowski-mmproj-f16
